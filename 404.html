<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Homestead HQ</title>
<meta name="robots" content="noindex">
<script>
  // Send mistyped beta links (/beta/, /Beta, /beta.html/) to /beta and keep ?src= for tracking.
  (function () {
    var p = location.pathname.toLowerCase().replace(/\/+$/, "").replace(/\.html$/, "");
    if (p === "/beta") location.replace("/beta" + location.search);
  })();
</script>

  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4efe2;color:#3f5236;

  h1{font-family:Georgia,"Times New Roman",serif}
  a{display:inline-block;margin:6px;padding:14px 20px;border-radius:14px;background:#6e8e5e;color:#f4efe2;text-decoration:none;font-weight:700}
  a.ghost{background:transparent;color:#3f5236;border:2px solid #6e8e5e}
</style>
</head>
<body>
  <main>
    <h1>This page wandered off</h1>

</body>
